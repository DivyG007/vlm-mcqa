[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-mcqa-mechinterp"
version = "0.1.0"
description = "Controlled experiments for mechanistic analysis of VLM multiple-choice answering"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.20",
  "matplotlib>=3.8",
  "Pillow>=10",
]

[project.optional-dependencies]
# Core-7 model runs (src/vlm_mcqa/core7). Install torch and torchvision for your CUDA first.
models = [
  "torch>=2.4",
  "torchvision>=0.19",  # Qwen2-VL / Qwen2.5-VL processors need it
  "transformers>=4.57",
  "accelerate>=0.34",
  "huggingface_hub>=0.25",
  "wandb>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
